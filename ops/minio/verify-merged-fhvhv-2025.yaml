apiVersion: batch/v1
kind: Job
metadata:
  name: verify-merged-fhvhv-2025
  namespace: bigdata
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role
                    operator: In
                    values: [master]
      containers:
        - name: minio-client
          image: minio/mc:latest
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mc alias set cluster http://minio.bigdata.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc stat --json cluster/bronze/fhvhv/2025/fhvhv_tripdata_2025.parquet
          envFrom:
            - secretRef:
                name: bigdata-secrets
