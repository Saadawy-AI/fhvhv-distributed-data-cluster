apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-migrate
  namespace: bigdata
spec:
  template:
    spec:
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role
                    operator: In
                    values: [master]
      containers:
        - name: migrate
          securityContext:
            runAsUser: 50000
          image: bigdata-lab-airflow:fhvhv-v1
          imagePullPolicy: Never
          command: [bash, -ec, airflow db migrate]
          envFrom:
            - configMapRef: {name: bigdata-config}
            - secretRef: {name: bigdata-secrets}
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://airflow:$(POSTGRES_PASSWORD)@10.43.67.163/airflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-create-user-script
  namespace: bigdata
data:
  create_user.sh: |
    #!/bin/bash
    airflow users create \
      --username admin \
      --firstname Admin \
      --lastname User \
      --role Admin \
      --email admin@bigdata.local \
      --password admin123 || true
    echo "Admin user ready"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-create-user
  namespace: bigdata
spec:
  template:
    spec:
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role
                    operator: In
                    values: [master]
      containers:
        - name: create-user
          securityContext:
            runAsUser: 50000
          image: bigdata-lab-airflow:fhvhv-v1
          imagePullPolicy: Never
          command: [bash, -ec]
          args:
            - |
              airflow users create \
                --username admin \
                --firstname Admin \
                --lastname User \
                --role Admin \
                --email admin@bigdata.local \
                --password admin123 || true
          envFrom:
            - configMapRef: {name: bigdata-config}
            - secretRef: {name: bigdata-secrets}
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://airflow:$(POSTGRES_PASSWORD)@10.43.67.163/airflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: bigdata
spec:
  replicas: 1
  selector: {matchLabels: {app: airflow-webserver}}
  template:
    metadata: {labels: {app: airflow-webserver}}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions: [{key: node-role, operator: In, values: [master]}]
      volumes:
        - name: java-volume
          hostPath:
            path: /usr/lib/jvm/java-11-openjdk-amd64
            type: Directory
      containers:
        - name: webserver
          securityContext:
            runAsUser: 50000
          image: bigdata-lab-airflow:fhvhv-v1
          imagePullPolicy: Never
          command: ["airflow", "webserver"]
          envFrom:
            - configMapRef: {name: bigdata-config}
            - secretRef: {name: bigdata-secrets}
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://airflow:$(POSTGRES_PASSWORD)@10.43.67.163/airflow
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bigdata-secrets
                  key: AIRFLOW_WEBSERVER_SECRET_KEY
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: bigdata-secrets
                  key: AIRFLOW_FERNET_KEY
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.bigdata.svc.cluster.local:9092
            - name: MINIO_ENDPOINT
              value: http://minio.bigdata.svc.cluster.local:9000
            - name: JAVA_HOME
              value: /opt/java
            - name: PATH
              value: /opt/java/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          volumeMounts:
            - name: java-volume
              mountPath: /opt/java
          ports: [{name: ui, containerPort: 8080}]
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: bigdata
spec:
  type: NodePort
  selector: {app: airflow-webserver}
  ports: [{name: ui, port: 8080, targetPort: ui, nodePort: 32082}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: bigdata
spec:
  replicas: 1
  selector: {matchLabels: {app: airflow-scheduler}}
  template:
    metadata: {labels: {app: airflow-scheduler}}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions: [{key: node-role, operator: In, values: [master]}]
      volumes:
        - name: java-volume
          hostPath:
            path: /usr/lib/jvm/java-11-openjdk-amd64
            type: Directory
      containers:
        - name: scheduler
          securityContext:
            runAsUser: 50000
          image: bigdata-lab-airflow:fhvhv-v1
          imagePullPolicy: Never
          command: ["airflow", "scheduler"]
          envFrom:
            - configMapRef: {name: bigdata-config}
            - secretRef: {name: bigdata-secrets}
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://airflow:$(POSTGRES_PASSWORD)@10.43.67.163/airflow
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bigdata-secrets
                  key: AIRFLOW_WEBSERVER_SECRET_KEY
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: bigdata-secrets
                  key: AIRFLOW_FERNET_KEY
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.bigdata.svc.cluster.local:9092
            - name: MINIO_ENDPOINT
              value: http://minio.bigdata.svc.cluster.local:9000
            - name: JAVA_HOME
              value: /opt/java
            - name: PYTHONPATH
              value: /home/airflow/.local/lib/python3.11/site-packages
            - name: PATH
              value: /home/airflow/.local/bin:/opt/java/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          volumeMounts:
            - name: java-volume
              mountPath: /opt/java
