# Copy this file to 02-secrets.yaml, replace every value, then apply it locally.
apiVersion: v1
kind: Secret
metadata:
  name: bigdata-secrets
  namespace: bigdata
type: Opaque
stringData:
  MINIO_ROOT_USER: CHANGE_ME_MINIO_USER
  MINIO_ROOT_PASSWORD: CHANGE_ME_MINIO_PASSWORD
  POSTGRES_USER: airflow
  POSTGRES_PASSWORD: CHANGE_ME_POSTGRES_PASSWORD
  POSTGRES_DB: airflow
  AIRFLOW_FERNET_KEY: CHANGE_ME_FERNET_KEY
  AIRFLOW_WEBSERVER_SECRET_KEY: CHANGE_ME_WEBSERVER_SECRET
