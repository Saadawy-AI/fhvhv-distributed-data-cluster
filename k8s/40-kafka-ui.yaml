apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: bigdata
spec:
  replicas: 1
  selector: {matchLabels: {app: kafka-ui}}
  template:
    metadata: {labels: {app: kafka-ui}}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions: [{key: node-role, operator: In, values: [master]}]
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: bigdata
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka.bigdata.svc.cluster.local:9092
          ports: [{name: ui, containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: bigdata
spec:
  type: NodePort
  selector: {app: kafka-ui}
  ports: [{name: ui, port: 8080, targetPort: ui, nodePort: 32080}]
